[project]
name = "yugen-docmost-mcp"
version = "0.1.1"
description = "Unofficial, security-first MCP server for self-hosted Docmost Community Edition."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yugen Labs" }]
keywords = ["docmost", "wiki", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "docmost-client>=0.1.0,<0.2",
    "mcp>=2.3.0,<3",
]

[project.urls]
Homepage = "https://github.com/YugenLabsTI/shrd-docmost-mcp"
Documentation = "https://github.com/YugenLabsTI/shrd-docmost-mcp#readme"
Issues = "https://github.com/YugenLabsTI/shrd-docmost-mcp/issues"
Changelog = "https://github.com/YugenLabsTI/shrd-docmost-mcp/blob/main/packages/yugen-docmost-mcp/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.8,<0.14"]
build-backend = "uv_build"

[project.scripts]
yugen-docmost-mcp = "yugen_docmost_mcp.__main__:main"
