name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release job starts CI on the release PR this way: pull requests opened with
  # GITHUB_TOKEN do not trigger workflows, workflow_dispatch is the exception.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --all-packages --no-dev --no-emit-workspace --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --all-packages -o dist
      - name: Pin the wheel check to the lockfile
        run: >-
          uv export --locked --all-packages --no-dev --no-emit-workspace --no-hashes
          --format requirements.txt -o "$RUNNER_TEMP/constraints.txt"
      - name: Install the built wheels in a clean environment and run them
        # Catches packaging gaps the tests cannot see (they run against the sources):
        # modules missing from a wheel, a broken entry point, metadata that cannot install.
        # Dependencies are pinned to uv.lock and only prebuilt wheels are accepted, so the
        # result depends on this commit alone and no third-party build code runs here;
        # dependency updates arrive separately through Dependabot.
        # Python 3.11 is the oldest version in both packages' requires-python.
        # The version check and imports below name the workspace packages: keep them in
        # sync when a package is added.
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.11 wheel-env
          VIRTUAL_ENV="$PWD/wheel-env" uv pip install --only-binary :all: \
            --constraints constraints.txt "$GITHUB_WORKSPACE"/dist/*.whl
          wheel=$(basename "$GITHUB_WORKSPACE"/dist/yugen_docmost_mcp-*.whl)
          expected="yugen-docmost-mcp $(echo "$wheel" | cut -d- -f2)"
          actual=$(wheel-env/bin/yugen-docmost-mcp --version)
          echo "expected: $expected / actual: $actual"
          test "$actual" = "$expected"
          wheel-env/bin/python -I -c "import docmost_client, yugen_docmost_mcp"

  release:
    # Opens or updates the release PR, and tags and releases the packages a merged release
    # PR bumped. It runs only on a push to main whose every check passed, so a failure in
    # either package stops the release of both.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository_owner == 'YugenLabsTI'
    needs: [lint, test, audit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Check that this commit is still the head of main
        # release-please works on the head of main, not on this commit: if main moved,
        # the run for the newer commit releases it once its own checks pass.
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved to $head; skipping the release for $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse to tag a release PR whose merge commit did not pass CI
        # release-please tags every merged release PR still labelled "autorelease: pending"
        # at its merge commit, also on a later run. Nothing stops a release PR from being
        # merged before its checks pass, so check the CI run of that commit first.
        if: steps.head.outputs.current == 'true'
        # An explicit bash adds pipefail, so a failing "gh pr list" fails the step instead
        # of reading as "no pending release PRs".
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label "autorelease: pending" \
            --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"' |
          while read -r number sha; do
            if [ "$sha" = "$GITHUB_SHA" ]; then
              continue
            fi
            conclusion=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push" \
              --jq '.workflow_runs[0].conclusion')
            if [ "$conclusion" != "success" ]; then
              echo "::error::Release PR #$number was merged as $sha, whose CI run is '$conclusion'; see Releases and versioning in the README."
              exit 1
            fi
          done
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.head.outputs.current == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: List the tags this run released
        id: tags
        if: steps.release.outputs.releases_created == 'true'
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          tags=$(jq -r '. as $o | [($o.paths_released | fromjson)[] | $o["\(.)--tag_name"]]
            | join(" ")' <<< "$OUTPUTS")
          echo "Released: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  publish:
    # Tags created with GITHUB_TOKEN start no workflows, so start the publication here
    # (workflow_dispatch is the exception). It runs on main and builds the new tags.
    needs: release
    if: needs.release.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Publish the released tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.release.outputs.tags }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tags="$TAGS"

  release-pr-ci:
    # Pull requests opened with GITHUB_TOKEN do not trigger workflows, so start CI on the
    # release PR's branch here (workflow_dispatch is the exception).
    needs: release
    if: needs.release.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
