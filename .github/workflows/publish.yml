name: Publish

# Publishes release tags to TestPyPI, installs them from there, and only then publishes
# them to PyPI, after a maintainer approves the pypi environment. The release job in
# ci.yml starts it after tagging (tags created with GITHUB_TOKEN start no workflows). A
# maintainer can also start it on main by hand: to publish a package for the first time,
# or to retry a failed run.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags separated by spaces, e.g. docmost-client-v0.1.0
        required: true
        type: string

permissions: {}

# One run per set of tags: a run waiting for approval never cancels the publication of
# another release, and a second run for the same tags waits for the first.
concurrency:
  group: publish-${{ inputs.tags }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the tagged packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.build.outputs.packages }}
    steps:
      - name: Refuse to run outside main
        # The environments, and with them the trusted publishers, only accept main.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start Publish on main; it builds the tags given as input."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Build each tag from its own commit
        id: build
        shell: bash
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          declare -A versions
          for tag in $TAGS; do
            [[ $tag =~ ^(docmost-client|yugen-docmost-mcp)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] ||
              fail "'$tag' is not a release tag such as docmost-client-v0.1.0."
            package=${BASH_REMATCH[1]}
            [[ -z ${versions[$package]:-} ]] || fail "More than one tag for $package."
            git rev-parse --quiet --verify "refs/tags/$tag^{commit}" > /dev/null ||
              fail "Tag $tag does not exist."
            git merge-base --is-ancestor "$tag" HEAD || fail "Tag $tag is not on main."
            versions[$package]=${BASH_REMATCH[2]}
          done
          (( ${#versions[@]} )) || fail "No tags given."

          packages=()
          # The client goes first: the server depends on it.
          for package in docmost-client yugen-docmost-mcp; do
            version=${versions[$package]:-}
            [[ -n $version ]] || continue
            git worktree add --detach "$RUNNER_TEMP/$package" "$package-v$version"
            uv build --directory "$RUNNER_TEMP/$package" --package "$package" --no-sources \
              --out-dir "$GITHUB_WORKSPACE/dist"
            dist=dist/${package//-/_}-$version
            [[ -f $dist-py3-none-any.whl && -f $dist.tar.gz ]] ||
              fail "Building $package-v$version did not produce version $version."
            packages+=("$package==$version")
          done
          echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run after a partial upload skips the files that are already there.
          skip-existing: true

  smoke:
    name: Install from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install the published versions from TestPyPI and run them
        # Only our packages come from TestPyPI (an explicit index); every other dependency
        # comes from PyPI, so a look-alike upload on TestPyPI cannot slip in. New files can
        # take a few minutes to show up in the TestPyPI index.
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PACKAGES: ${{ needs.build.outputs.packages }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          dependencies='"docmost-client"'
          sources='docmost-client = { index = "testpypi" }'
          for spec in $PACKAGES; do
            dependencies+=", \"$spec\""
            if [[ $spec == yugen-docmost-mcp==* ]]; then
              sources+=$'\n''yugen-docmost-mcp = { index = "testpypi" }'
            fi
          done
          mkdir smoke
          cat > smoke/pyproject.toml <<EOF
          [project]
          name = "publish-smoke"
          version = "0"
          requires-python = ">=3.11"
          dependencies = [$dependencies]

          [[tool.uv.index]]
          name = "testpypi"
          url = "https://test.pypi.org/simple/"
          explicit = true

          [tool.uv.sources]
          $sources
          EOF

          for attempt in $(seq 1 10); do
            uv sync --project smoke --refresh --quiet && break
            (( attempt < 10 )) || fail "The new versions could not be installed from TestPyPI."
            echo "Not installable yet; retrying in 30 seconds."
            sleep 30
          done

          for spec in $PACKAGES; do
            package=${spec%%==*}
            expected=${spec#*==}
            actual=$(uv run --project smoke --no-sync python -I -c \
              'import importlib.metadata, sys; print(importlib.metadata.version(sys.argv[1]))' \
              "$package")
            echo "$package: expected $expected, installed $actual"
            [[ $actual == "$expected" ]] || fail "TestPyPI served $package $actual."
          done
          uv run --project smoke --no-sync python -I -c "import docmost_client"
          if [[ $PACKAGES == *yugen-docmost-mcp==* ]]; then
            uv run --project smoke --no-sync yugen-docmost-mcp --version
          fi

  pypi:
    name: Publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
