version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The disposable Docmost the integration job runs against: images pinned by digest.
  - package-ecosystem: docker-compose
    directory: /dev/docmost
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
